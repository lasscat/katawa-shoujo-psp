name: Bug report
description: Something does not work as it should
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: PSP model and firmware, or PPSSPP version, or desktop OS.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit hash.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
