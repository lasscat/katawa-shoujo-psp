name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libsdl2-dev shellcheck clang-format python3-pytest
      - name: Check
        run: scripts/check.sh

  psp:
    runs-on: ubuntu-24.04
    container: pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build EBOOT
        run: |
          apk add --no-cache bash cmake make
          scripts/build.sh psp
      - uses: actions/upload-artifact@v4
        with:
          name: eboot
          path: dist/PSP
